.sf-nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;font-size:11.5px;font-weight:600;color:#65676B;-webkit-tap-highlight-color:transparent}

.sf-ni{display:grid;place-items:center;height:32px;width:58px;border-radius:999px;transition:background .15s,transform .1s}
.sf-nb:active .sf-ni{transform:scale(.94)}
.sf-nb.on{color:#1877F2}.sf-nb.on .sf-ni{background:#E7F3FF}
.dark .sf-nb.on{color:#2D88FF}.dark .sf-nb.on .sf-ni{background:rgba(45,136,255,.22)}
.sf-fab{position:fixed;right:16px;bottom:calc(5.25rem + env(safe-area-inset-bottom,0px));z-index:10;display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 18px 0 14px;border-radius:999px;background:#1877F2;color:#fff;font-weight:700;font-size:.92rem;box-shadow:0 8px 22px -6px rgba(24,119,242,.65)}
.dark .sf-fab{background:#2D88FF}
@media(min-width:768px){.sf-nav,.sf-fab{display:none}}
.sf-actions{position:sticky;bottom:calc(5rem + env(safe-area-inset-bottom,0px));z-index:9;display:flex;gap:8px;align-items:stretch;padding:10px;border-radius:1rem;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid #CED0D4;box-shadow:0 -4px 18px -6px rgba(0,0,0,.2)}
@media(min-width:768px){.sf-actions{bottom:12px}}
.dark .sf-actions{background:rgba(36,37,38,.95);border-color:#3E4042}
.sf-actions button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;font-size:.95rem;font-weight:600;border-radius:.8rem}
.sf-actions .sf-main{flex:1 1 auto;order:3}.sf-actions .sf-back{order:2}.sf-actions .sf-del{order:1}
@media(max-width:767px){
.pop-panel.sf-menu{position:fixed;left:12px;right:12px;width:auto;top:auto;bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));max-height:68vh;border-radius:1.1rem;box-shadow:0 -10px 40px -8px rgba(0,0,0,.45)}
.pop-ov{background:rgba(0,0,0,.35)}
}

.sf-nb.on{font-weight:700}
