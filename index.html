.c-blue{--c:#1877F2}.c-teal{--c:#31A24C}.c-amber{--c:#D97706}.c-rose{--c:#E11D48}.c-violet{--c:#7C3AED}
.cv-wrap{display:flex;flex-direction:column;gap:14px}
.cv-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.cv-title{margin-right:auto}.cv-title h2{font-size:1.5rem;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.cv-sub{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cv-pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:999px;background:#E4E6EB;color:#050505}
.dark .cv-pill{background:#3A3B3C;color:#E4E6EB}
.cv-nav{display:inline-flex;border:1px solid #CED0D4;border-radius:.75rem;overflow:hidden;background:#fff}
.cv-nav button{padding:.45rem .75rem;font-size:.85rem;font-weight:600;display:inline-flex;align-items:center}
.cv-nav button+button{border-left:1px solid #CED0D4}.cv-nav button:hover{background:#E4E6EB}
.dark .cv-nav{background:#242526;border-color:#3E4042}.dark .cv-nav button+button{border-color:#3E4042}.dark .cv-nav button:hover{background:#3A3B3C}
.cv-grid,.cv-day{border:1px solid #CED0D4;border-radius:1rem;background:#fff;overflow:hidden}
.cv-day{padding:16px;overflow:visible}
.dark .cv-grid,.dark .cv-day{border-color:#3E4042;background:#242526}
.cv-dow,.cv-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cv-dow div{padding:8px 6px;text-align:center;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#65676B;background:#F0F2F5;border-bottom:1px solid #CED0D4}
.dark .cv-dow div{background:#2A2B2D;border-color:#3E4042;color:#94A3B8}
.cv-cell{min-height:96px;padding:6px;text-align:left;border-right:1px solid #E4E6EB;border-bottom:1px solid #E4E6EB;display:flex;flex-direction:column;gap:4px;position:relative;min-width:0}
.cv-cell:nth-child(7n){border-right:0}.cv-cell:hover{background:#F0F2F5}
.dark .cv-cell{border-color:#3E4042}.dark .cv-cell:hover{background:#3A3B3C}
.cv-void,.cv-void:hover{background:#F7F8FA}.dark .cv-void,.dark .cv-void:hover{background:#1C1D1E}
.cv-cell.sel{box-shadow:inset 0 0 0 2px #1877F2;background:#E7F3FF;z-index:1}.dark .cv-cell.sel{background:#263951}
.cv-top{display:flex;align-items:center;justify-content:space-between;gap:4px}
.cv-num{font-size:.8rem;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:999px}
.cv-cell.today .cv-num{background:#1877F2;color:#fff}
.cv-net{font-size:.65rem;font-weight:600;color:#65676B;font-variant-numeric:tabular-nums}
.cv-chips{display:flex;flex-direction:column;gap:2px;min-width:0}
.cv-chip{font-size:.68rem;font-weight:600;line-height:1.4;padding:1px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-left:3px solid var(--c)}
.dark .cv-chip{color:color-mix(in srgb,var(--c) 45%,#fff)}
.cv-chip.task:before{content:"\2610  "}.cv-chip.task.done:before{content:"\2611  "}.cv-chip.task.done{text-decoration:line-through;opacity:.55}
.cv-more{font-size:.65rem;color:#65676B;padding-left:4px}
.cv-dots{display:none;gap:3px;flex-wrap:wrap;margin-top:auto}.cv-dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
@media(max-width:639px){.cv-cell{min-height:58px;padding:4px}.cv-chips,.cv-net{display:none}.cv-dots{display:flex}.cv-title h2{font-size:1.25rem}}
.cv-dh{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}.cv-dh h3{font-size:1.05rem;font-weight:700;margin-right:auto}
.cv-sec{font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#65676B;margin:14px 0 6px}
.cv-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #CED0D4;border-radius:.9rem;margin-bottom:6px}
.dark .cv-row{border-color:#3E4042}
.cv-bar{width:4px;align-self:stretch;border-radius:4px;background:var(--c)}
.cv-rb{flex:1;min-width:0}.cv-rt{font-weight:600;font-size:.9rem}.cv-rs{font-size:.78rem;color:#65676B}
.cv-row.done .cv-rt{text-decoration:line-through;opacity:.6}
.cv-check{width:22px;height:22px;border-radius:7px;border:2px solid var(--c);display:grid;place-items:center;color:#fff;font-size:.8rem;flex:none}.cv-check.on{background:var(--c)}
.cv-empty{text-align:center;color:#65676B;padding:22px 8px;font-size:.9rem}
.pop{position:relative;display:inline-block}.pop-ov{position:fixed;inset:0;z-index:40}
.pop-panel{position:absolute;right:0;top:calc(100% + 6px);z-index:41;min-width:230px;max-width:calc(100vw - 2rem);background:#fff;border:1px solid #CED0D4;border-radius:.9rem;box-shadow:0 14px 34px -10px rgba(6,32,79,.35);padding:6px}
.dark .pop-panel{background:#242526;border-color:#3E4042}
.pop-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:.6rem;font-size:.875rem;text-align:left}
.pop-item:hover,.sf-opt:hover{background:#E4E6EB}.dark .pop-item:hover,.dark .sf-opt:hover{background:#3A3B3C}
.cv-ov{position:fixed;inset:0;z-index:50;background:rgba(2,12,36,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px}
@media(min-width:640px){.cv-ov{align-items:center}}
.cv-modal{width:100%;max-width:30rem;max-height:92vh;overflow:auto;background:#fff;border-radius:1.25rem;padding:18px;box-shadow:0 24px 60px -12px rgba(0,0,0,.45)}
.dark .cv-modal{background:#242526;border:1px solid #3E4042}
.cv-mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cv-seg{display:inline-flex;background:#E4E6EB;border-radius:.75rem;padding:3px}.dark .cv-seg{background:#3A3B3C}
.cv-seg button{padding:.35rem 1rem;border-radius:.6rem;font-size:.85rem;font-weight:600;color:#65676B}
.cv-seg button.on{background:#fff;color:#1877F2;box-shadow:0 1px 3px rgba(0,0,0,.15)}.dark .cv-seg button.on{background:#242526;color:#6AB0FF}
.cv-form{display:grid;gap:12px;grid-template-columns:1fr 1fr}.cv-form .full{grid-column:1/-1}
.cv-allday{display:flex;align-items:center;gap:8px;font-size:.875rem;align-self:end;padding-bottom:.55rem}
.cv-sw{display:flex;gap:10px}.cv-sw button{width:28px;height:28px;border-radius:50%;background:var(--c);border:3px solid #fff}.cv-sw button.on{box-shadow:0 0 0 2px var(--c)}
.dark .cv-sw button{border-color:#242526}
.cv-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.sf-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.sf-bar>*{flex:1 1 220px}
.sf-trig{display:inline-flex;align-items:center;gap:8px;padding:.5rem .8rem;border-radius:.75rem;border:1px solid #CED0D4;background:#fff;font-size:.875rem;font-weight:600}
.dark .sf-trig{background:#242526;border-color:#3E4042}
.sf-badge{background:#1877F2;color:#fff;border-radius:999px;font-size:.7rem;padding:1px 8px}.sf-caret{opacity:.6;font-size:.7rem}

.sf-opt small{margin-left:auto;color:#65676B;font-variant-numeric:tabular-nums}

.sf-q{display:flex;gap:6px;padding:2px 10px 8px;flex-wrap:wrap}
